services:
  - type: web
    name: clearcopy
    runtime: static
    buildCommand: cd product && npm ci && npm run build
    staticPublishPath: product/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; worker-src 'self' blob:; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
